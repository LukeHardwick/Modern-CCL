# Audit configuration for databases/sample/models/jet.glb (task T22c), read by
# tools/models/audit_model.py. Method and reasons: docs/research/04-model-audit.md.
#
# Coordinates are in the modelling frame of tools/models/hawk.py: metres, x = vehicle left,
# y = aft (the nose is at -y), z = up. Gate values are PROPOSALS until the user approves them.

[model]
name = "jet"
# Published BAE Systems Hawk 128 figures (Wikipedia, accessed 2026-10-12), check E.
published_size = { length = 12.43, span = 9.94, height = 3.98 }
eyepoints = ["eyepoint_front", "eyepoint_rear"]   # empties; used by the hidden check once they exist
glass_materials = ["glass", "hud"]                 # see-through: never hide what is behind them
default_group = "exterior"

[sampling]
spacing = 0.05       # no two samples on a triangle further apart than this (m)
inset = 0.01         # samples pulled 1 % towards the centroid, so none sits exactly on a shared edge
weld = 1e-6          # vertices closer than this count as one for topology (m)
vis_spacing = 0.25   # coarser sample grid for the visibility rays (m)
vis_inset = 0.001    # visibility samples stay at least 1 mm inside every edge (no leaks at seams)

# Design viewing conditions: the closest a viewer is expected to look at each group.
[view]
width = 1920
height = 1080
vfov_deg = 60.0

[visibility]
directions = 162     # rays per sample, spread evenly over the front hemisphere
ray_offset = 1e-4    # rays start 0.1 mm off the surface (m)

[headroom]
ratios = [0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1, 0.05, 0.02, 0.01]
min_component = 2000 # only connected pieces with at least this many triangles

[reference]
min_density = 4.0    # warn when a reference node has fewer than 4x the model's triangles

[gates]
headroom_max = 0.15        # C: at most 15 % of a large piece's triangles removable without loss
hidden_max = 0.02          # C: at most 2 % of a node's triangles hidden in every pose
subpixel_max = 0.10        # C: at most 10 % of a group's triangles smaller than a pixel
verts_per_tri_max = 0.65   # C: exported vertices per triangle (shared vertices)
index_max = 65535          # C: raylib 6.0 indices are 16-bit
degenerate_max = 0         # D
duplicate_max = 0          # D
flipped_max = 0            # D
floating_max = 0           # D
winding_max = 0            # D
sliver_max = 0.01          # D: at most 1 % of triangles with an angle under 2 degrees
size_tolerance = 0.02      # E: length, span and height within 2 % of the published figures
# Gates that make the audit exit with status 1 (the others are reported as FAIL only):
hard = ["index_max", "degenerate_max", "duplicate_max", "flipped_max", "floating_max",
        "budget_total"]

# Triangle budget decided by the user on 2026-10-13.
[budget]
total = 250000
file_bytes = 10000000      # 10 MB
nodes = 24
materials = 10
primitives = 40            # draw calls
[budget.groups]
exterior = 100000
cockpit = 150000

# Node groups: closest design distance and the accuracy gates for checks A and B.
# Pixel size at distance D: p = 2 D tan(vfov / 2) / height (8 m -> 8.55 mm; 0.6 m -> 0.64 mm).
[[groups]]
name = "exterior"
nodes = ["fuselage", "canopy", "aileron_l", "aileron_r", "flap_l", "flap_r", "elevator",
         "rudder", "airbrake", "gear"]
distance = 8.0
shape_p99 = 0.001          # 1 mm
shape_max = 0.004          # 4 mm
normal_p95_deg = 2.0
normal_max_deg = 10.0

[[groups]]
name = "cockpit"
nodes = ["cockpit", "hud_glass"]
distance = 0.6
shape_p99 = 0.0003         # 0.3 mm
shape_max = 0.0012
normal_p95_deg = 2.0
normal_max_deg = 10.0

# Poses for the hidden check: a triangle counts as visible if it can be seen in ANY pose.
# Angles as make_models.DEFLECT: [axis (0 = x, 1 = y, 2 = z), degrees] about the node pivot.
[[poses]]
name = "rest"

[[poses]]
name = "controls"
[poses.rotate]
aileron_l = [0, 22.0]
aileron_r = [0, -22.0]
flap_l = [0, -28.0]
flap_r = [0, -28.0]
elevator = [0, -14.0]
rudder = [2, 22.0]
airbrake = [0, -50.0]

[[poses]]
name = "controls_opposite"
[poses.rotate]
aileron_l = [0, -22.0]
aileron_r = [0, 22.0]
elevator = [0, 14.0]
rudder = [2, -22.0]

[[poses]]
name = "canopy_open"
[poses.rotate]
canopy = [1, -65.0]

[[poses]]
name = "gear_up"
hide = ["gear"]

# Profile probes (check F): rays every `step` metres from `start` to `end`, cast along
# `direction`; the first hit on the listed nodes and materials gives the outline. Connected
# parts shorter than `min_feature` along the probe line (canopy frame hoops, circumferential
# panel lines, fasteners, lights) are ignored.
[[probes]]
name = "canopy_crown_left"
start = [0.10, -3.55, 3.0]
end = [0.10, -0.40, 3.0]
nodes = ["fuselage", "canopy"]
materials = ["paint", "glass"]
max_maxima = 1             # one smooth bubble
max_minima = 0

[[probes]]
name = "canopy_crown_right"
start = [-0.10, -3.55, 3.0]
end = [-0.10, -0.40, 3.0]
nodes = ["fuselage", "canopy"]
materials = ["paint", "glass"]
max_maxima = 1
max_minima = 0

[[probes]]
name = "canopy_spine_left"
start = [0.10, -0.60, 3.0]
end = [0.10, 1.20, 3.0]
nodes = ["fuselage", "canopy"]
materials = ["paint", "glass"]
max_minima = 0             # the canopy flows into the spine without a dip
kink_max_deg = 2.0
step_max = 0.002

[[probes]]
name = "canopy_spine_right"
start = [-0.10, -0.60, 3.0]
end = [-0.10, 1.20, 3.0]
nodes = ["fuselage", "canopy"]
materials = ["paint", "glass"]
max_minima = 0
kink_max_deg = 2.0
step_max = 0.002

[[probes]]
name = "nose_top"
start = [0.0, -5.70, 3.0]
end = [0.0, -3.70, 3.0]
nodes = ["fuselage"]
materials = ["paint"]
max_maxima = 0             # the nose rises smoothly to the windscreen
max_minima = 0
step_max = 0.002
