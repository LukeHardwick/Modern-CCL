# ---------------------------------------------------------------- F3 sections
# plane at (axis, at) metres; ratio = width / height; fill = area / bounding rectangle; flat_mm_max =
# largest deviation of either side from a straight line over flat_height_m about the widest
# height; radius_mm = [min, max] of the tightest outline corner (not resolved below about 15 mm:
# a 24 mm arc is sampled, see fidelity_section.min_radius). x_clip_m drops anything wider (wing
# struts attached to the cabin).
[F3_sections]
nodes = ["fuselage", "door_l", "door_r"]


# FLAGGED for the user, value not changed: radius_mm [15, 90] reads like the lip-edge bevel (F5 measures
# that); as the corner radius of the 0.86 m wide section it would demand an almost square cowl
# (T22d measures 189 mm; the cabin sections use 60-250). cabin_door ratio [0.62, 0.72] is also
# unverified: neighbouring reference stations read 0.72-0.78.
[[F3_section]]
name = "cowl_lip"
axis = "y"
at = -2.0
ratio = [1.17, 1.43]   # CALIBRATED: reference 1.30 +- 10 % (proposal 1.00-1.20)
fill_min = 0.76
radius_mm = [15, 90]

[[F3_section]]
name = "firewall"
axis = "y"
at = -1.55
ratio = [0.90, 1.05]
fill_min = 0.80
flat_mm_max = 25
flat_height_m = 0.4
radius_mm = [50, 250]

[[F3_section]]
name = "cabin_door"
axis = "y"
at = -0.2
ratio = [0.62, 0.72]
fill_min = 0.84
flat_mm_max = 12
flat_height_m = 0.7
radius_mm = [60, 250]

[[F3_section]]
name = "cabin_rear"
axis = "y"
at = 1.15
ratio = [0.68, 0.80]
fill_min = 0.82
flat_mm_max = 15
flat_height_m = 0.6
radius_mm = [60, 250]

[[F3_section]]
name = "tail_cone"
axis = "y"
at = 3.0
ratio = [0.79, 0.97]   # CALIBRATED: reference 0.88 +- 10 % (proposal 0.80-1.00)
fill_min = 0.76
radius_mm = [80, 300]

# ---------------------------------------------------------------- F4 textures and UVs
[F4_textures]
family = "textured"             # "vertex_colour" for the cessna_vc*.glb family (command line --family)
exempt_materials = ["glass", "hud"]   # translucent: no texture sheets needed
max_texture_px = 2048
assumed_sheet_px = 2048         # UV layout is judged on this size while a sheet has no image yet
density_spread_max = 2.0        # p95 / p5 per sheet
uv_overlap_px_max = 0           # except exact x -> -x mirrors sharing texture space
padding_px_min = 8
bleed_px = 8
bleed_diff_max = 12             # 8-bit levels: a bleed texel may differ this much from the nearest island texel
bleed_bad_max = 0.05            # at most this share of bleed texels may be off
normal_unit_length_tol = 0.02
metallic_binary_fraction_min = 0.95
base_colour_srgb_range = [30, 240]
base_colour_outside_max = 0.01  # at most 1 % of covered texels outside the range
gpu_bytes_max = 268435456       # 256 MB uncompressed RGBA8 with mips
glb_bytes_max = 25165824        # 24 MB hard for the textured file (aim 16 MB)
glb_bytes_max_vertex_colour = 10000000   # cessna_vc*.glb keeps the old 10 MB
primitive_vertices_max = 65535

[[F4_textures.sheet]]
name = "ext_fuselage"
nodes = ["fuselage", "door_l", "door_r", "gear"]
[[F4_textures.sheet]]
name = "ext_aero"
nodes = ["wing_l", "wing_r", "aileron_l", "aileron_r", "flap_l", "flap_r", "elevator", "rudder", "propeller"]
[[F4_textures.sheet]]
name = "cockpit"
nodes = ["cockpit"]

# texel density floors (p5, area weighted) by group; a primitive joins the first group that lists
# its node or material, else "airframe"
[[F4_textures.density_group]]
name = "small_parts"
min_px_per_m = 250
nodes = ["gear", "propeller", "elevator", "rudder"]
[[F4_textures.density_group]]
name = "panel_faces"
min_px_per_m = 1500
materials = ["panel"]
[[F4_textures.density_group]]
name = "airframe"
min_px_per_m = 400
default = true

# ---------------------------------------------------------------- F5 edges
[F5_edges]
min_segments = 3                # a bevel needs this many mesh segments ...
resolved_radius_mm = 2.0        # ... unless it is below this (then the normal map must carry it)
no_named_edge_radius_over_mm = 40
hard_crease_fraction = [0.03, 0.08]   # share of two-face edge length with a > 30 degree crease

# probe: cut the nodes with the plane (axis, at), take the polyline that reaches farthest in dir
# (axis letter and sign), optionally only among points whose in-plane perpendicular coordinate is in
# window. radius = bevel radius of that edge; thickness = width 1 mm behind the tip.

[[F5_edge]]
name = "wing_trailing_edge"
radius_mm = [1.0, 3.0]
thickness_mm = [1.5, 5.0]
[[F5_edge.probe]]
nodes = ["flap_l"]
plane = { axis = "x", at = 2.0 }
dir = "+y"
[[F5_edge.probe]]
nodes = ["aileron_l"]
plane = { axis = "x", at = 4.3 }
dir = "+y"

[[F5_edge]]
name = "control_surface_edges"
radius_mm = [2.0, 6.0]
[[F5_edge.probe]]
nodes = ["elevator"]
plane = { axis = "x", at = 0.8 }
dir = "+y"
[[F5_edge.probe]]
nodes = ["rudder"]
plane = { axis = "z", at = 0.8 }
dir = "+y"

[[F5_edge]]
name = "door_frame"
radius_mm = [2.0, 6.0]
[[F5_edge.probe]]
nodes = ["door_l"]
plane = { axis = "z", at = 0.2 }
dir = "+y"

[[F5_edge]]
name = "window_frames"
radius_mm = [3.0, 8.0]

[[F5_edge]]
name = "cowl_lip"
radius_mm = [8.0, 20.0]
[[F5_edge.probe]]
nodes = ["fuselage"]
plane = { axis = "x", at = 0.0 }
dir = "-y"

[[F5_edge]]
name = "tailplane_and_fin_tips"
radius_mm = [3.0, 10.0]
[[F5_edge.probe]]
nodes = ["elevator"]
plane = { axis = "y", at = 5.3 }
dir = "+x"

[[F5_edge]]
name = "fin_leading_edge"
radius_mm = [4.0, 15.0]
[[F5_edge.probe]]
nodes = ["fuselage"]
plane = { axis = "z", at = 1.2 }
dir = "-y"

[visual_review]   # subjective, not a gate
engine = "CYCLES"
device = "CPU"
seed = 1
samples = 96
denoise = false
sky = "Nishita"
ground = "shadow catcher"
width = 1600
png_max_kb = 300
cameras = ["34front", "34rear", "side", "top", "front", "tail", "cabin", "eyepoint_left", "eyepoint_right",
           "closeup_nose", "closeup_wing_root", "closeup_door", "closeup_tail"]
