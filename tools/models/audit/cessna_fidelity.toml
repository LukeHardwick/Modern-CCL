# PROPOSED fidelity gates for cessna.glb (task T22e, Phase 0, 2026-10-14). NOT APPROVED.
# Method and reasons: docs/research/05-cessna-fidelity.md, section (d). Read by
# tools/models/fidelity_audit.py (built in Phase 1). Values are proposals calibrated by
# reasoning, not data: Phase 1 measures the T22d baseline and the noise floor, then the user
# fixes them before CP1. Frame: metres, x = vehicle left, y = aft (nose at -y), z = up.

[meta]
status = "PROPOSED"
model = "cessna"
reference = "TBD: user-approved three-view (see research doc section c)"

[F1_outline]
views = ["side", "top", "front"]
exclude_nodes = ["cockpit", "prop_disc"]
raster_px_per_cm = 2
scaling = "published length/span/height + two named landmarks (no best fit)"
iou_min = { side = 0.94, top = 0.94, front = 0.90 }
outline_p95_mm = 30
outline_max_mm = 80
station_tol_mm = 40
stations = ["cowl_front", "windscreen_base", "wing_le_root", "wing_le_tip", "fin_top",
            "rudder_te", "tailplane_tip", "spinner_tip", "nose_wheel_centre", "belly_line"]

[F2_features]
required_fraction = 1.0
optional_fraction = 0.75
# kind = geometry: probe box (model frame) must hold >= tris triangles of `material` with relief >= relief_mm
# kind = texture : normal map in the probe's UV region has >= pixels groove pixels (|tilt| > 0.1) or a distinct colour
# Probe boxes are filled when the feature exists (CP2); count_min applies from then on.
[[features]]
name = "window_frames"
kind = "geometry"
required = true
count_min = 12
relief_mm = 3
