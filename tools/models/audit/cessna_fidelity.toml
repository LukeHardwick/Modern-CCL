# ---------------------------------------------------------------- F2 features
# Probe boxes ("box = [x0, y0, z0, x1, y1, z1]", model frame, metres) are filled by the modelling
# phases once a feature exists (CP2); a feature without a box counts as absent. count_min =
# triangles (geometry) or separate marks in the normal map / colour map (texture).
[F2_features]
required_fraction = 1.0
optional_fraction = 0.75
groove_tilt = 0.1               # normal tilt above which a texel is a groove
colour_delta = 40               # sRGB distance from the median colour for mode = "colour"
min_mark_px = 4                 # smaller marks are noise


