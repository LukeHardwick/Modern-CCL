[F3_sections]
# plane y (m); ratio = width / height; fill = outline area / bounding rectangle;
# flat_mm = largest deviation of the side from a straight line over flat_height_m;
# radius_mm = [min, max] of the tightest outline corner. ESTIMATES: refine in Phase 1.
[[sections]]
name = "cowl_lip"
y = -2.0
ratio = [1.00, 1.20]
fill_min = 0.76
radius_mm = [15, 90]
[[sections]]
name = "firewall"
y = -1.55
ratio = [0.90, 1.05]
fill_min = 0.80
flat_mm_max = 25
flat_height_m = 0.4
radius_mm = [50, 250]
[[sections]]
name = "cabin_door"
y = -0.2
ratio = [0.62, 0.72]
fill_min = 0.84
flat_mm_max = 12
flat_height_m = 0.7
radius_mm = [60, 250]
[[sections]]
name = "cabin_rear"
y = 1.15
ratio = [0.68, 0.80]
fill_min = 0.82
flat_mm_max = 15
flat_height_m = 0.6
radius_mm = [60, 250]
[[sections]]
name = "tail_cone"
y = 3.0
ratio = [0.80, 1.00]
fill_min = 0.76
radius_mm = [80, 300]

[F4_textures]
required_maps = ["baseColor", "normal", "occlusionRoughnessMetallic"]
texel_density_px_per_m = { airframe = 400, small_parts = 250, panel_faces = 1500 }
density_spread_max = 2.0          # p95 / p5 per sheet
uv_overlap_px_max = 0             # except exact x -> -x mirrors
padding_px_min = 8
bleed_px = 8
sizes = "power of two, <= 2048"
normal_unit_length_tol = 0.02
metallic_binary_fraction_min = 0.95
base_colour_srgb_range = [30, 240]
sheets = ["ext_fuselage", "ext_aero", "cockpit"]
gpu_bytes_max = 268435456         # 256 MB uncompressed RGBA8 with mips
glb_bytes_max = 25165824          # 24 MB hard for the textured file (aim 16 MB)
glb_bytes_max_vertex_colour = 10000000   # cessna_vc*.glb keeps the old 10 MB
primitive_vertices_max = 65535

[F5_edges]
# radius_mm = [min, max] from a section perpendicular to the edge; needs >= 3 mesh segments
# across the bevel to count (radii under 2 mm may live in the normal map instead).
[[edges]]
name = "wing_trailing_edge"
radius_mm = [1.0, 3.0]
thickness_mm = [1.5, 5.0]
[[edges]]
name = "control_surface_edges"
radius_mm = [2.0, 6.0]
[[edges]]
name = "door_frame"
radius_mm = [2.0, 6.0]
[[edges]]
name = "window_frames"
radius_mm = [3.0, 8.0]
[[edges]]
name = "cowl_lip"
radius_mm = [8.0, 20.0]
[[edges]]
name = "tailplane_and_fin_tips"
radius_mm = [3.0, 10.0]
[[edges]]
name = "fin_leading_edge"
radius_mm = [4.0, 15.0]
[edges_global]
no_named_edge_radius_over_mm = 40
hard_crease_fraction = [0.03, 0.08]   # share of surface edge length with > 30 degrees

[visual_review]   # subjective, not a gate
engine = "CYCLES"
device = "CPU"
seed = 1
samples = 96
denoise = false
sky = "Nishita"
ground = "shadow catcher"
width = 1600
png_max_kb = 300
cameras = ["34front", "34rear", "side", "top", "front", "tail", "cabin", "eyepoint_left", "eyepoint_right",
           "closeup_nose", "closeup_wing_root", "closeup_door", "closeup_tail"]
