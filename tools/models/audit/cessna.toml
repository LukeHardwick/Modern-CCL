# Audit configuration for databases/sample/models/cessna.glb (task T22d), read by
# tools/models/audit_model.py. Method and reasons: docs/research/04-model-audit.md.
#
# Coordinates are in the modelling frame of tools/models/cessna.py: metres, x = vehicle left,
# y = aft (the spinner is at -y), z = up, origin about the centre of gravity.
# PROPOSED values (2026-10-14, STOP 0): the jet's user-approved gates, unchanged, with the
# Cessna's figures, nodes, poses and probes. The user sets the final values; probe coordinates
# are refined at CP1 once the outline exists (the gate types stay).

[model]
name = "cessna"
# Published Cessna 172R figures (Wikipedia, accessed 2026-10-14), check E.
published_size = { length = 8.28, span = 11.00, height = 2.72 }
eyepoints = ["eyepoint_left", "eyepoint_right"]   # pilot (left seat) and right seat
glass_materials = ["glass", "hud"]                 # windows; "hud" = the translucent prop disc
default_group = "exterior"

[sampling]
spacing = 0.05       # no two samples on a triangle further apart than this (m)
inset = 0.01         # samples pulled 1 % towards the centroid, so none sits exactly on a shared edge
weld = 1e-6          # vertices closer than this count as one for topology (m)
kmax = 400           # at most 400 subdivisions per edge: spacing holds on triangles up to 20 m
vis_spacing = 0.25   # coarser sample grid for the visibility rays (m)
vis_kmax = 64        # up to 16 m; longer triangles get sparser samples (the report warns)
vis_inset = 0.001    # visibility samples stay at least 1 mm inside every edge (no leaks at seams)

# Design viewing conditions: the closest a viewer is expected to look at each group.
[view]
width = 1920
height = 1080
vfov_deg = 60.0

[visibility]
directions = 162     # rays per sample, spread evenly over the front hemisphere
ray_offset = 1e-4    # rays start 0.1 mm off the surface (m)
parallel_min = 20000 # from this many triangles, worker processes cast the rays (--jobs N);
                     # speed only: the results do not depend on it
worker_timeout = 1200.0  # a worker still running after this many seconds is stopped and its
                         # share computed in the main process (same result, only slower)

[headroom]
ratios = [0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1, 0.05, 0.02, 0.01]
min_component = 2000 # only connected pieces with at least this many triangles
slack = 0.05         # a piece that already misses the shape gate may get at most 5 % worse
max_reverse_points = 50000  # larger pieces use an even subset of the reference points (speed)

[reference]
min_density = 4.0    # warn when a reference node has fewer than 4x the model's triangles

[gates]
headroom_max = 0.15        # C: at most 15 % of a large piece's triangles removable without loss
hidden_max = 0.02          # C: at most 2 % of a node's triangles hidden in every pose
subpixel_max = 0.10        # C: at most 10 % of a group's triangles smaller than a pixel
verts_per_tri_max = 0.65   # C: exported vertices per triangle (shared vertices)
index_max = 65535          # C: raylib 6.0 indices are 16-bit
degenerate_max = 0         # D
duplicate_max = 0          # D
flipped_max = 0            # D
floating_max = 0           # D
winding_max = 0            # D
sliver_max = 0.01          # D: at most 1 % of triangles with an angle under 2 degrees
size_tolerance = 0.02      # E: length, span and height within 2 % of the published figures
unmeasured_max = 0.02      # A: at most 2 % of a group's visible area "not measured" (coincides
                           # with the reference on a curve, so its error cannot be measured)
# Gates that make the audit exit with status 1 (the others are reported as FAIL only):
hard = ["index_max", "degenerate_max", "duplicate_max", "flipped_max", "floating_max",
        "budget_total"]

# Triangle budget: the hero tier decided by the user on 2026-10-13 (same as the jet).
[budget]
total = 250000
file_bytes = 10000000      # 10 MB (soft)
nodes = 24
materials = 10
primitives = 40            # draw calls
[budget.groups]
exterior = 100000
cockpit = 150000

# Node groups: closest design distance and the accuracy gates for checks A and B.
# Pixel size at distance D: p = 2 D tan(vfov / 2) / height (8 m -> 8.55 mm; 0.6 m -> 0.64 mm).
[[groups]]
name = "exterior"
nodes = ["fuselage", "wing_l", "wing_r", "aileron_l", "aileron_r", "flap_l", "flap_r",
         "elevator", "rudder", "propeller", "prop_disc", "door_l", "door_r", "gear"]
required = true
distance = 8.0
shape_p99 = 0.001          # 1 mm
shape_max = 0.004          # 4 mm
normal_p95_deg = 2.0
normal_max_deg = 10.0

[[groups]]
name = "cockpit"
nodes = ["cockpit", "cockpit_panel"]
required = true            # the cockpit (CP2b)
distance = 0.6
shape_p99 = 0.0003         # 0.3 mm
shape_max = 0.0012
normal_p95_deg = 2.0
normal_max_deg = 10.0

# Poses for the hidden check: a triangle counts as visible if it can be seen in ANY pose.
# Angles as make_models.DEFLECT: [axis (0 = x, 1 = y, 2 = z), degrees] about the node pivot.
[[poses]]
name = "rest"

[[poses]]
name = "controls"
[poses.rotate]
aileron_l = [0, 20.0]
aileron_r = [0, -15.0]
flap_l = [0, -30.0]
flap_r = [0, -30.0]
elevator = [0, -25.0]
rudder = [2, 24.0]

[[poses]]
name = "controls_opposite"
[poses.rotate]
aileron_l = [0, -15.0]
aileron_r = [0, 20.0]
elevator = [0, 15.0]
rudder = [2, -24.0]

[[poses]]
name = "doors_open"
[poses.rotate]
door_l = [2, -70.0]   # outwards (sign fixed at the T22d review; positive yaw is nose left)
door_r = [2, 70.0]

[[poses]]
name = "prop_turned"       # the blades a quarter turn on, so the spinner and cowl face behind
[poses.rotate]             # them count as visible
propeller = [1, 90.0]

[[poses]]
name = "no_disc"
hide = ["prop_disc"]

# Profile probes (check F), same rules as the jet (see jet.toml). Coordinates are first guesses
# for the CP1 outline.
[[probes]]
name = "cowl_to_windscreen_left"   # spinner back to the wing: the cowl rises smoothly into the
start = [0.12, -2.25, 3.0]         # windscreen, no dips or steps (the cowl/glass joint may kink)
end = [0.12, -0.50, 3.0]
nodes = ["fuselage"]
materials = ["paint", "glass"]
min_coverage = 0.95
max_maxima = 0
max_minima = 0
step_max = 0.002

[[probes]]
name = "cowl_to_windscreen_right"
start = [-0.12, -2.25, 3.0]
end = [-0.12, -0.50, 3.0]
nodes = ["fuselage"]
materials = ["paint", "glass"]
min_coverage = 0.95
max_maxima = 0
max_minima = 0
step_max = 0.002

[[probes]]
name = "tailcone_top_left"         # behind the wing over the rear window down the tailcone,
start = [0.15, 1.45, 3.0]          # beside the dorsal fin: one smooth descending line
end = [0.15, 4.20, 3.0]
nodes = ["fuselage"]
materials = ["paint", "glass"]
min_coverage = 0.95
max_maxima = 0
max_minima = 0
kink_max_deg = 2.0
step_max = 0.002

[[probes]]
name = "tailcone_top_right"
start = [-0.15, 1.45, 3.0]
end = [-0.15, 4.20, 3.0]
nodes = ["fuselage"]
materials = ["paint", "glass"]
min_coverage = 0.95
max_maxima = 0
max_minima = 0
kink_max_deg = 2.0
step_max = 0.002

[[probes]]
name = "belly"                     # firewall to tail, looking up: no lumps (gear is its own node)
start = [0.0, -1.70, -3.0]
end = [0.0, 4.40, -3.0]
direction = [0.0, 0.0, 1.0]
nodes = ["fuselage"]
materials = ["paint"]
min_coverage = 0.95
max_maxima = 1                     # the belly's lowest point under the cabin (looking up,
max_minima = 0                     # the outline height is -z, so it is a maximum)
kink_max_deg = 2.0
step_max = 0.002
